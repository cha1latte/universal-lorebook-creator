name: Temporary Prime Intellect EPUB build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install ebooklib beautifulsoup4 pillow requests lxml
      - name: Build EPUB
        shell: bash
        run: |
          cat > /tmp/build_epub.py <<'PY'
          import io, os, re, uuid, zipfile
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup, Tag
          from ebooklib import epub
          from PIL import Image, ImageDraw, ImageFont

          BASE = 'https://localroger.com/prime-intellect/'
          OUT = Path('artifact')
          OUT.mkdir(exist_ok=True)
          title = 'The Metamorphosis of Prime Intellect'
          author = 'Roger Williams'
          chapter_names = [
              ('One', 'Caroline At Play'),
              ('Two', 'Lawrence Builds a Computer'),
              ('Three', 'Caroline and Anne-Marie'),
              ('Four', 'After the Night of Miracles'),
              ('Five', 'Caroline Approaches'),
              ('Six', 'After the Change'),
              ('Seven', 'Caroline and Lawrence'),
              ('Eight', 'After the Fall'),
          ]

          session = requests.Session()
          session.headers['User-Agent'] = 'Mozilla/5.0 EPUB personal-format conversion'

          def fetch(url):
              r = session.get(url, timeout=60)
              r.raise_for_status()
              return r.content

          def extract_chapter(number, numeral, subtitle):
              raw = fetch(f'{BASE}mopi{number}.html').decode('utf-8', errors='replace')
              soup = BeautifulSoup(raw, 'lxml')
              pre = next((p for p in soup.find_all('pre') if 'Chapter' in p.get_text()), None)
              if pre is None:
                  raise RuntimeError(f'Could not find chapter heading in mopi{number}.html')
              heading_table = pre.find_parent('table')
              outer_td = heading_table.find_parent('td') if heading_table else None
              if outer_td is None:
                  raise RuntimeError(f'Could not locate chapter body in mopi{number}.html')

              pieces = []
              started = False
              for child in list(outer_td.children):
                  if child is heading_table:
                      started = True
                      continue
                  if not started:
                      continue
                  if isinstance(child, Tag):
                      text = child.get_text(' ', strip=True).lower()
                      if child.name in ('hr', 'center'):
                          break
                      if child.name == 'table' and child.find('a') and any(x in text for x in ('chapter', 'home', 'previous', 'next', 'top')):
                          break
                  pieces.append(str(child))

              fragment = BeautifulSoup(''.join(pieces), 'lxml')
              body = fragment.body or fragment
              for img in body.find_all('img'):
                  if img.get('src', '').endswith('1pix.gif'):
                      img.decompose()
                  else:
                      img.decompose()
              for tag in body.find_all(['script', 'style', 'center', 'font']):
                  tag.unwrap() if tag.name in ('center', 'font') else tag.decompose()
              for tag in body.find_all(True):
                  keep = {}
                  if tag.name in ('td', 'th'):
                      for attr in ('colspan', 'rowspan'):
                          if tag.has_attr(attr): keep[attr] = tag[attr]
                  tag.attrs = keep
              # Old HTML uses BRs as paragraph separators; retain them while CSS provides readable spacing.
              html = ''.join(str(x) for x in body.contents).strip()
              plain = BeautifulSoup(html, 'lxml').get_text(' ', strip=True)
              if len(plain) < 10000:
                  raise RuntimeError(f'Chapter {number} extraction unexpectedly short: {len(plain)} chars')
              return html, len(plain)

          chapters_data = []
          total_chars = 0
          for idx, (numeral, subtitle) in enumerate(chapter_names, 1):
              html, chars = extract_chapter(idx, numeral, subtitle)
              chapters_data.append((numeral, subtitle, html))
              total_chars += chars
          if total_chars < 300000:
              raise RuntimeError(f'Book extraction unexpectedly short: {total_chars} chars')

          # Original moth artwork from the author's page.
          art_bytes = fetch(BASE + 'mopimoth.gif')
          art = Image.open(io.BytesIO(art_bytes)).convert('RGBA')

          W, H = 1600, 2560
          cover = Image.new('RGB', (W, H), '#f4f0e6')
          draw = ImageDraw.Draw(cover)
          serif_candidates = [
              '/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf',
              '/usr/share/fonts/truetype/liberation2/LiberationSerif-Regular.ttf',
          ]
          bold_candidates = [
              '/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf',
              '/usr/share/fonts/truetype/liberation2/LiberationSerif-Bold.ttf',
          ]
          serif = next(p for p in serif_candidates if os.path.exists(p))
          bold = next(p for p in bold_candidates if os.path.exists(p))
          title_font = ImageFont.truetype(bold, 118)
          author_font = ImageFont.truetype(serif, 62)
          small_font = ImageFont.truetype(serif, 40)

          def centered_multiline(text, y, font, spacing=20, fill='#17221c'):
              box = draw.multiline_textbbox((0, 0), text, font=font, spacing=spacing, align='center')
              tw = box[2] - box[0]
              draw.multiline_text(((W - tw) / 2, y), text, font=font, spacing=spacing, align='center', fill=fill)

          centered_multiline('THE METAMORPHOSIS\nOF PRIME INTELLECT', 250, title_font, 30)
          draw.line((260, 720, W-260, 720), fill='#355846', width=5)
          max_art_w, max_art_h = 900, 900
          scale = min(max_art_w / art.width, max_art_h / art.height)
          art = art.resize((int(art.width * scale), int(art.height * scale)), Image.Resampling.LANCZOS)
          cover.paste(art, ((W-art.width)//2, 880), art)
          draw.line((420, 1920, W-420, 1920), fill='#355846', width=3)
          centered_multiline('A NOVEL', 2025, small_font, 10)
          centered_multiline(author, 2130, author_font, 10)
          cover_path = OUT / 'cover.jpg'
          cover.save(cover_path, 'JPEG', quality=94, optimize=True)

          css = '''
          html { color-scheme: light dark; }
          body { font-family: Georgia, "Times New Roman", serif; line-height: 1.55; margin: 5%; max-width: 42em; color: #171714; background: #fffdf8; }
          p { margin: 0; text-indent: 1.45em; }
          p + p { margin-top: .15em; }
          em, i { font-style: italic; }
          h1.chapter { font-family: "Courier New", monospace; font-size: 1.65em; line-height: 1.2; margin: 18% 0 2.5em; page-break-before: always; }
          h1.chapter .star { color: #355846; }
          table { border-collapse: collapse; margin: 1.1em 0 1.25em; max-width: 100%; }
          td { vertical-align: top; padding: .08em .22em; }
          tt, code { font-family: "Courier New", ui-monospace, monospace; font-weight: bold; white-space: normal; }
          .title-page, .toc-page { text-align: center; }
          .title-page h1 { font-size: 2.2em; line-height: 1.08; margin-top: 18%; }
          .title-page img { display: block; max-width: 70%; max-height: 42vh; margin: 2.2em auto; }
          .title-page .author { font-size: 1.25em; }
          .rights { font-size: .82em; text-align: left; margin-top: 5em; color: #555; }
          .toc-page { text-align: left; }
          .toc-page h1 { text-align: center; margin: 12% 0 2em; }
          .toc-page ol { list-style: none; padding: 0; }
          .toc-page li { margin: .8em 0; }
          .toc-page a { color: #274d39; text-decoration: none; }
          .chapter-label { font-variant: small-caps; letter-spacing: .04em; }
          @media (prefers-color-scheme: dark) {
            body { color: #eee9df; background: #171714; }
            .rights { color: #b7b0a4; }
            .toc-page a, h1.chapter .star { color: #9bc3a8; }
          }
          '''

          book = epub.EpubBook()
          book.set_identifier(str(uuid.uuid4()))
          book.set_title(title)
          book.set_language('en')
          book.add_author(author)
          book.add_metadata('DC', 'rights', 'Copyright © 1994 Roger Williams. Personal-use format conversion from the author-published HTML edition.')
          book.set_cover('cover.jpg', cover_path.read_bytes())

          style = epub.EpubItem(uid='style', file_name='style/book.css', media_type='text/css', content=css.encode())
          book.add_item(style)
          art_item = epub.EpubItem(uid='moth-art', file_name='images/mopimoth.gif', media_type='image/gif', content=art_bytes)
          book.add_item(art_item)

          title_page = epub.EpubHtml(title='Title Page', file_name='title.xhtml', lang='en')
          title_page.content = f'''<div class="title-page"><h1>{title}</h1><img src="images/mopimoth.gif" alt="Original moth artwork"/><p class="author">A Novel by {author}</p><p class="rights">Copyright © 1994 Roger Williams.<br/>This EPUB is a personal-use conversion of the author’s freely published HTML edition. The novel text and original artwork are unchanged.</p></div>'''
          title_page.add_item(style)
          book.add_item(title_page)

          chapter_items = []
          for idx, (numeral, subtitle, html) in enumerate(chapters_data, 1):
              item = epub.EpubHtml(title=f'Chapter {numeral}: {subtitle}', file_name=f'chapter-{idx}.xhtml', lang='en')
              item.content = f'<h1 class="chapter"><span class="star">*</span> Chapter {numeral}:<br/>&nbsp;&nbsp;{subtitle}</h1>{html}'
              item.add_item(style)
              book.add_item(item)
              chapter_items.append(item)

          toc_page = epub.EpubHtml(title='Table of Contents', file_name='contents.xhtml', lang='en')
          links = ''.join(f'<li><a href="chapter-{i}.xhtml"><span class="chapter-label">Chapter {n}</span>: {s}</a></li>' for i, (n, s) in enumerate(chapter_names, 1))
          toc_page.content = f'<div class="toc-page"><h1>Table of Contents</h1><ol>{links}</ol></div>'
          toc_page.add_item(style)
          book.add_item(toc_page)

          book.toc = tuple(chapter_items)
          book.add_item(epub.EpubNcx())
          nav = epub.EpubNav()
          nav.add_item(style)
          book.add_item(nav)
          book.spine = ['cover', title_page, toc_page] + chapter_items + ['nav']

          epub_path = OUT / 'The_Metamorphosis_of_Prime_Intellect.epub'
          epub.write_epub(str(epub_path), book, {})

          with zipfile.ZipFile(epub_path) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError(f'Corrupt EPUB member: {bad}')
              names = set(z.namelist())
              required = {'mimetype', 'META-INF/container.xml', 'EPUB/contents.xhtml'}
              missing = required - names
              if missing:
                  raise RuntimeError(f'Missing EPUB files: {missing}')
              for i in range(1, 9):
                  if f'EPUB/chapter-{i}.xhtml' not in names:
                      raise RuntimeError(f'Missing chapter {i}')
          print(f'Built {epub_path} from {total_chars} extracted characters')
          PY
          python /tmp/build_epub.py
      - name: Upload EPUB
        uses: actions/upload-artifact@v4
        with:
          name: prime-intellect-epub
          path: artifact/The_Metamorphosis_of_Prime_Intellect.epub
          if-no-files-found: error
