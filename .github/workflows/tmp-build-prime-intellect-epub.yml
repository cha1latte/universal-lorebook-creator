name: Temporary Prime Intellect EPUB build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install ebooklib beautifulsoup4 pillow requests lxml
      - name: Build EPUB
        shell: bash
        run: |
          cat > /tmp/build_epub.py <<'PY'
          import io, os, re, uuid, zipfile
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from ebooklib import epub
          from PIL import Image, ImageDraw, ImageFont

          OUT = Path('artifact'); OUT.mkdir(exist_ok=True)
          TITLE = 'The Metamorphosis of Prime Intellect'
          AUTHOR = 'Roger Williams'
          CHAPTERS = [
              ('One', 'Caroline At Play'), ('Two', 'Lawrence Builds a Computer'),
              ('Three', 'Caroline and Anne-Marie'), ('Four', 'After the Night of Miracles'),
              ('Five', 'Caroline Approaches'), ('Six', 'After the Change'),
              ('Seven', 'Caroline and Lawrence'), ('Eight', 'After the Fall')]
          S = requests.Session(); S.headers['User-Agent'] = 'Mozilla/5.0 personal EPUB conversion'

          def get_any(urls):
              errors=[]
              for u in urls:
                  try:
                      r=S.get(u, timeout=60); r.raise_for_status(); return r.content
                  except Exception as e: errors.append(f'{u}: {e}')
              raise RuntimeError('\n'.join(errors))

          mirror='https://raw.githubusercontent.com/thesmoremail/thesmoremail.github.io/83aa869b195866c635b215a8031ea98cfd2c1e5e/best/prime_intelect/'
          raw=get_any(['https://localroger.com/prime-intellect/mopiall.html', mirror+'mopiall.html']).decode('utf-8','replace')
          art_bytes=get_any(['https://localroger.com/prime-intellect/mopimoth.gif', mirror+'mopimoth.gif'])

          heading_re=re.compile(r'<font\s+size="\+3"><b><pre>\*\s*Chapter\s+(One|Two|Three|Four|Five|Six|Seven|Eight):\s*(.*?)</pre></b></font>', re.I|re.S)
          matches=list(heading_re.finditer(raw))
          print('chapter markers:', len(matches))
          if len(matches)!=8: raise RuntimeError(f'Expected 8 chapter markers, found {len(matches)}')

          extracted=[]; total_chars=0
          for i,m in enumerate(matches):
              end=matches[i+1].start() if i+1<len(matches) else raw.lower().rfind('</body>')
              fragment=raw[m.end():end]
              soup=BeautifulSoup(fragment,'lxml')
              body=soup.body or soup
              for img in body.find_all('img'): img.decompose()
              for tag in body.find_all(['script','style','form']): tag.decompose()
              for a in body.find_all('a'): a.unwrap()
              for tag in body.find_all(True):
                  keep={}
                  if tag.name in ('td','th'):
                      for attr in ('colspan','rowspan'):
                          if tag.has_attr(attr): keep[attr]=tag[attr]
                  tag.attrs=keep
              html=''.join(str(x) for x in body.contents).strip()
              plain=BeautifulSoup(html,'lxml').get_text(' ',strip=True)
              # Remove site navigation accidentally captured after the final chapter.
              if i==7:
                  for phrase in ('Return to the Prime Intellect Home Page','Copyright'):
                      pos=plain.find(phrase)
                      if pos>0: plain=plain[:pos]
              print(i+1, CHAPTERS[i], len(plain))
              if len(plain)<9000: raise RuntimeError(f'Chapter {i+1} unexpectedly short: {len(plain)}')
              extracted.append(html); total_chars+=len(plain)
          if total_chars<300000: raise RuntimeError(f'Book unexpectedly short: {total_chars}')

          art=Image.open(io.BytesIO(art_bytes)).convert('RGBA')
          W,H=1600,2560; cover=Image.new('RGB',(W,H),'#f4f0e6'); d=ImageDraw.Draw(cover)
          serif=next(p for p in ['/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf','/usr/share/fonts/truetype/liberation2/LiberationSerif-Regular.ttf'] if os.path.exists(p))
          bold=next(p for p in ['/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf','/usr/share/fonts/truetype/liberation2/LiberationSerif-Bold.ttf'] if os.path.exists(p))
          tf=ImageFont.truetype(bold,118); af=ImageFont.truetype(serif,62); sf=ImageFont.truetype(serif,40)
          def center(text,y,font,spacing=20,fill='#17221c'):
              b=d.multiline_textbbox((0,0),text,font=font,spacing=spacing,align='center'); w=b[2]-b[0]
              d.multiline_text(((W-w)/2,y),text,font=font,spacing=spacing,align='center',fill=fill)
          center('THE METAMORPHOSIS\nOF PRIME INTELLECT',250,tf,30)
          d.line((260,720,W-260,720),fill='#355846',width=5)
          scale=min(900/art.width,900/art.height); art=art.resize((int(art.width*scale),int(art.height*scale)),Image.Resampling.LANCZOS)
          cover.paste(art,((W-art.width)//2,880),art)
          d.line((420,1920,W-420,1920),fill='#355846',width=3); center('A NOVEL',2025,sf); center(AUTHOR,2130,af)
          cover_path=OUT/'cover.jpg'; cover.save(cover_path,'JPEG',quality=94,optimize=True)

          css='''body{font-family:Georgia,"Times New Roman",serif;line-height:1.55;margin:5%;max-width:42em;color:#171714;background:#fffdf8}p{margin:0;text-indent:1.45em}p+p{margin-top:.15em}em,i{font-style:italic}h1.chapter{font-family:"Courier New",monospace;font-size:1.65em;line-height:1.2;margin:18% 0 2.5em;page-break-before:always}h1.chapter .star{color:#355846}table{border-collapse:collapse;margin:1.1em 0 1.25em;max-width:100%}td{vertical-align:top;padding:.08em .22em}tt,code{font-family:"Courier New",monospace;font-weight:bold;white-space:normal}.title-page{text-align:center}.title-page h1{font-size:2.2em;line-height:1.08;margin-top:18%}.title-page img{display:block;max-width:70%;max-height:42vh;margin:2.2em auto}.title-page .author{font-size:1.25em}.rights{font-size:.82em;text-align:left;margin-top:5em;color:#555}.toc-page h1{text-align:center;margin:12% 0 2em}.toc-page ol{list-style:none;padding:0}.toc-page li{margin:.8em 0}.toc-page a{color:#274d39;text-decoration:none}.chapter-label{font-variant:small-caps;letter-spacing:.04em}@media(prefers-color-scheme:dark){body{color:#eee9df;background:#171714}.rights{color:#b7b0a4}.toc-page a,h1.chapter .star{color:#9bc3a8}}'''

          book=epub.EpubBook(); book.set_identifier(str(uuid.uuid4())); book.set_title(TITLE); book.set_language('en'); book.add_author(AUTHOR)
          book.add_metadata('DC','rights','Copyright © 1994 Roger Williams. Personal-use format conversion from the author-published HTML edition.')
          book.set_cover('cover.jpg',cover_path.read_bytes())
          style=epub.EpubItem(uid='style',file_name='style/book.css',media_type='text/css',content=css.encode()); book.add_item(style)
          art_item=epub.EpubItem(uid='moth-art',file_name='images/mopimoth.gif',media_type='image/gif',content=art_bytes); book.add_item(art_item)
          title_page=epub.EpubHtml(title='Title Page',file_name='title.xhtml',lang='en')
          title_page.content=f'<div class="title-page"><h1>{TITLE}</h1><img src="images/mopimoth.gif" alt="Original moth artwork"/><p class="author">A Novel by {AUTHOR}</p><p class="rights">Copyright © 1994 Roger Williams.<br/>Personal-use conversion of the author’s freely published HTML edition. The novel text and original artwork are unchanged.</p></div>'; title_page.add_item(style); book.add_item(title_page)
          items=[]
          for i,((num,sub),html) in enumerate(zip(CHAPTERS,extracted),1):
              c=epub.EpubHtml(title=f'Chapter {num}: {sub}',file_name=f'chapter-{i}.xhtml',lang='en'); c.content=f'<h1 class="chapter"><span class="star">*</span> Chapter {num}:<br/>&nbsp;&nbsp;{sub}</h1>{html}'; c.add_item(style); book.add_item(c); items.append(c)
          toc=epub.EpubHtml(title='Table of Contents',file_name='contents.xhtml',lang='en')
          links=''.join(f'<li><a href="chapter-{i}.xhtml"><span class="chapter-label">Chapter {n}</span>: {s}</a></li>' for i,(n,s) in enumerate(CHAPTERS,1)); toc.content=f'<div class="toc-page"><h1>Table of Contents</h1><ol>{links}</ol></div>'; toc.add_item(style); book.add_item(toc)
          book.toc=tuple(items); book.add_item(epub.EpubNcx()); nav=epub.EpubNav(); nav.add_item(style); book.add_item(nav); book.spine=['cover',title_page,toc]+items+['nav']
          path=OUT/'The_Metamorphosis_of_Prime_Intellect.epub'; epub.write_epub(str(path),book,{})
          with zipfile.ZipFile(path) as z:
              if z.testzip(): raise RuntimeError('EPUB ZIP integrity failure')
              names=z.namelist();
              if 'mimetype' not in names or sum(1 for n in names if re.search(r'chapter-[1-8]\.xhtml$',n))!=8: raise RuntimeError('EPUB package validation failure')
          print('SUCCESS',path,path.stat().st_size,total_chars)
          PY
          python /tmp/build_epub.py
      - name: Upload EPUB
        uses: actions/upload-artifact@v4
        with:
          name: prime-intellect-epub
          path: artifact/The_Metamorphosis_of_Prime_Intellect.epub
          if-no-files-found: error
